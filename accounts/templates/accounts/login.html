{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Вход | Todo List</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'accounts/auth.css' %}">
</head>
<body>
    <div class="auth-card">
        <div class="auth-header">
            <h1>🔐 Вход</h1>
            <p>Добро пожаловать обратно!</p>
        </div>
        <div class="auth-body">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="auth-btn">Войти</button>
            </form>
            <div class="auth-footer">
                <p>Нет аккаунта? <a href="{% url 'register' %}">Зарегистрируйся</a></p>
            </div>
        </div>
    </div>
</body>
</html>
